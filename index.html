<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc4U</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/calc_setup.js"></script>
</head>

<body>
    <header class="header">
        <h1 class="title">
            Calc4U
        </h1>
    </header>
    <main class="main">
        <div class="main__controls">
            <button class="button button--random-color-change"> Randomize Color</button>
        </div>
        <div class="calculator">
            <div class="calculator__display" tabindex="-1">
            </div>
            <div class="calculator__operations_and_numbers">
                <div class="calculator__operations">
                </div>
                <div class="calculator__numbers">
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <p class="footer__paragraph--name">
            <script>
                let footer = document.querySelector('.footer__paragraph--name')
                footer.textContent = `TC ${new Date().getFullYear()}`
            </script>
        </p>
    </footer>
    <script type="module" src="src/calc_setup.js"></script>
</body>

</html>
